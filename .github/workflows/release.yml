name: Release binaries
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/check.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Build installable programs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          test "$version" = "$(cat VERSION)"
          make release VERSION="$version"
      - name: Publish binaries after checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/bab_*.tar.gz dist/SHA256SUMS
