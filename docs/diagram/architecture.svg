<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1510 770" role="img" aria-labelledby="title desc">
<title id="title">Browser Auth Bridge architecture</title>
<desc id="desc">Two plugin paths. One browser-owned login. Page scripts use the BAB Native Host; external CLIs use their own Native Hosts and the shared extension.</desc>
